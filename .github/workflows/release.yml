name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Tests and version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify release tag matches the application version
        shell: bash
        run: |
          VERSION="$(sed -n 's/.*packageVersion = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts)"
          test -n "$VERSION"
          test "$RELEASE_TAG" = "v$VERSION" || {
            echo "Release tag $RELEASE_TAG does not match application version v$VERSION"
            exit 1
          }
      - name: Run tests
        run: ./gradlew :composeApp:desktopTest --no-daemon

  android:
    name: Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nameveil-release.jks"
          echo "NAMEVEIL_KEYSTORE_PATH=$RUNNER_TEMP/nameveil-release.jks" >> "$GITHUB_ENV"
          echo "NAMEVEIL_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NAMEVEIL_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NAMEVEIL_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed APK
        run: ./gradlew :composeApp:assembleRelease --no-daemon
      - name: Stage APK
        run: |
          VERSION="${RELEASE_TAG#v}"
          cp composeApp/build/outputs/apk/release/composeApp-release.apk "NameVeil-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: NameVeil-*-android.apk

  windows:
    name: Windows MSI and portable ZIP
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI and portable application
        shell: pwsh
        run: ./gradlew.bat :composeApp:createDistributable :composeApp:packageMsi --no-daemon
      - name: Stage Windows packages
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $msi = Get-ChildItem composeApp/build/compose/binaries/main/msi -Filter *.msi | Select-Object -First 1
          $portable = Get-Item composeApp/build/compose/binaries/main/app/NameVeil
          Copy-Item -LiteralPath $msi.FullName -Destination "NameVeil-$version-windows-x64.msi"
          Compress-Archive `
            -LiteralPath $portable.FullName `
            -DestinationPath "NameVeil-$version-windows-x64-portable.zip" `
            -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            NameVeil-*-windows-x64.msi
            NameVeil-*-windows-x64-portable.zip

  linux:
    name: Linux DEB
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build DEB
        run: ./gradlew :composeApp:packageDeb --no-daemon
      - name: Stage DEB
        run: |
          VERSION="${RELEASE_TAG#v}"
          SOURCE="$(find composeApp/build/compose/binaries/main/deb -name '*.deb' -print -quit)"
          cp "$SOURCE" "NameVeil-${VERSION}-linux-x64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: NameVeil-*-linux-x64.deb

  publish:
    name: Publish GitHub Release
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release-assets/*
